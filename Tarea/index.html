<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lab 08 - Tarea: Gestor de Tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 10px; }
    section { border: 1px solid #ccc; padding: 14px; margin-bottom: 16px; border-radius: 6px; }
    .error { color: #c0392b; background-color: #fadbd8; padding: 8px; border-radius: 4px; display: none; margin-top: 8px; }
    .tarea-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee; }
    .completada { text-decoration: line-through; color: #7f8c8d; }
    .btn-completar { background-color: #2ecc71; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; margin-right: 4px; }
    .btn-eliminar { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
    .badge { font-size: 0.8em; padding: 2px 6px; border-radius: 4px; background: #e0e0e0; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>DISAVIP: Gestor de Tareas Interactivo</h1>

  <section>
    <h2>Nueva Tarea</h2>
    <form id="formTarea">
      <input id="inputTitulo" type="text" placeholder="Escribe el título de la tarea...">
      <select id="selectPrioridad">
        <option value="Alta">Alta</option>
        <option value="Media" selected>Media</option>
        <option value="Baja">Baja</option>
      </select>
      <button type="submit">Agregar Tarea</button>
    </form>
    <p id="mensajeError" class="error"></p>
  </section>

  <section>
    <h2>Filtro de Búsqueda</h2>
    <input id="inputBuscar" type="text" placeholder="Buscar tarea por título...">
    <p>Tareas visibles: <span id="contadorTareas">0</span></p>
  </section>

  <section>
    <h2>Mis Tareas</h2>
    <ul id="listaTareas"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
